name: Performance & Accessibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm run build

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun
        continue-on-error: true

  a11y:
    name: Accessibility (Pa11y)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm run build

      - name: Install Chrome for Puppeteer
        id: setup-chrome
        run: |
          pnpm exec puppeteer browsers install chrome
          echo "chrome-path=$(find /home/runner/.cache/puppeteer -name chrome -type f | head -1)" >> "$GITHUB_OUTPUT"

      - name: Start preview server
        run: pnpm run preview &

      - name: Wait for server
        run: pnpm exec wait-on http://localhost:4321/ --timeout 30000

      - name: Run Pa11y CI
        run: pnpm exec pa11y-ci -c .pa11yci.cjs
        continue-on-error: true
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}